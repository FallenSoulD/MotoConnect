workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Noctura Forge
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Sign and Build iOS app
        script: |
          echo "=== KEYCHAIN INITIALIZE ==="
          keychain initialize

          echo "=== FETCH APP STORE CERTS ==="
          app-store-connect fetch-signing-files com.fallensould.motoconnect \
            --type IOS_APP_STORE \
            --create

          echo "=== FETCH DEV CERTS ==="
          app-store-connect fetch-signing-files com.fallensould.motoconnect \
            --type IOS_APP_DEVELOPMENT \
            --create

          echo "=== ADD CERTS TO KEYCHAIN ==="
          keychain add-certificates

          echo "=== USE PROFILES ==="
          xcode-project use-profiles

          echo "=== DEBUG: SIGNING IDENTITIES ==="
          security find-identity -v -p codesigning

          echo "=== DEBUG: PROVISIONING PROFILES ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "No profiles"

          echo "=== BUILDING IPA ==="
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
