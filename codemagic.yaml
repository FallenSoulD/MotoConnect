workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Noctura Forge
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Set up code signing
        script: |
          keychain initialize
          echo ">>> Fetching App Store signing files..."
          app-store-connect fetch-signing-files com.fallensould.motoconnect \
            --type IOS_APP_STORE \
            --create
          echo ">>> Fetching Development signing files..."
          app-store-connect fetch-signing-files com.fallensould.motoconnect \
            --type IOS_APP_DEVELOPMENT \
            --create
          echo ">>> Adding certificates to keychain..."
          keychain add-certificates
          echo ">>> Applying profiles to Xcode project..."
          xcode-project use-profiles
          echo ">>> Listing signing identities in keychain..."
          security find-identity -v -p codesigning
          echo ">>> Listing provisioning profiles..."
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "No profiles found"

      - name: Build iOS app
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
