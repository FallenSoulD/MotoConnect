workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Noctura Forge1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files com.fallensould.motoconnect \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS app
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist \
            -- \
            CODE_SIGN_STYLE=Manual

    artifacts:
      - build/ios/ipa/*.ipa
